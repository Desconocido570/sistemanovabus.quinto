<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mis boletos | NovaBus</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/cliente.css"
    >

</head>

<body>


<header class="client-navbar">

    <a
        href="/cliente/inicio.html"
        class="client-brand"
    >

        <span class="client-brand-icon">
            <i class="bi bi-bus-front-fill"></i>
        </span>

        NovaBus

    </a>


    <nav class="client-nav-links">

        <a href="/cliente/inicio.html">

            <i class="bi bi-search"></i>

            <span>
                Buscar
            </span>

        </a>


        <a href="/cliente/reservas.html">

            <i class="bi bi-journal-check"></i>

            <span>
                Mis reservas
            </span>

        </a>


        <a
            href="/cliente/mis-boletos.html"
            class="active"
        >

            <i class="bi bi-ticket-perforated"></i>

            <span>
                Mis boletos
            </span>

        </a>


        <a href="/cliente/perfil.html">

            <i class="bi bi-person"></i>

            <span>
                Perfil
            </span>

        </a>


        <button
            id="btnCerrarSesion"
            type="button"
        >

            <i class="bi bi-box-arrow-right"></i>

            <span>
                Salir
            </span>

        </button>

    </nav>

</header>


<main class="client-shell">


    <div class="page-title">

        <span class="section-kicker">
            MIS VIAJES
        </span>

        <h1>
            Mis boletos
        </h1>

        <p>
            Aquí aparecen únicamente los boletos emitidos.
            Puedes consultar sus datos y descargar el PDF.
        </p>

    </div>


    <section class="client-section">


        <div class="client-section-heading">

            <div>

                <span class="section-kicker">
                    BOLETOS
                </span>

                <h2>
                    Boletos emitidos
                </h2>

                <p>
                    Presenta tu boleto al momento de viajar.
                </p>

            </div>

        </div>


        <div
            id="listaBoletos"
            class="ticket-list"
        >

            <div class="empty-client">
                Cargando boletos...
            </div>

        </div>


    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="/js/cliente-api.js"></script>
<script src="/js/mis-boletos.js"></script>


</body>
</html>
